# 本工作流在 main 分支更新后构建并发布 GitHub Pages。
name: 发布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 运行检查
        run: npm run check
      - name: 生成静态网站
        run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          LOOKUP_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          LOOKUP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          LOOKUP_FUNCTION_NAME: isbn-bookshelf-lookup
          APP_URL: https://josiezhou00.github.io/isbn-bookshelf/
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
